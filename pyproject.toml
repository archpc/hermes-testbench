[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "hermes-testbench"
dynamic = ["version"]
description = "Isolated test, benchmark, and verification engine with persisted evidence (CLI, MCP, TUI)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Topic :: Software Development :: Testing",
]

[project.scripts]
testbench = "hermes_testbench.cli:main"

[tool.hatch.version]
path = "hermes_testbench/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["hermes_testbench"]

# Mutation-testing opt-in for TestBench (ADR-0008). Scope: the evidence-integrity
# surface (secret redaction and tool-output normalization) vs hermetic unit tests.
# Slow recursive suites (test_mutation_testing, engine/CLI) are intentionally not
# re-run per mutant; full-regression remains the sign-off gate.
[tool.mutmut]
source_paths = ["hermes_testbench/"]
only_mutate = [
    "hermes_testbench/sanitize.py",
    "hermes_testbench/adapters/parsers.py",
]
pytest_add_cli_args_test_selection = [
    "tests/test_sanitize.py",
    "tests/test_review_remediation_parsers.py",
    "tests/test_pytest_quiet_summary.py",
    "tests/test_output_contract.py",
    "tests/test_cobol_parser_coverage.py",
]
